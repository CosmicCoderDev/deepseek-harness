# Native Electron carrier: retain the shared Host and browser plugin roster,
# remove every listening/HTTP-only row, and mount Connection without Web glue.
- id: webserver
  disabled: true

- id: web-runtime
  disabled: true

- id: client-hmr
  disabled: true

# A desktop launch always has a local display. Pin both halves of the native
# picker instead of the Web auto-selector, whose decision requires bind facts.
- id: directory-picker
  disabled: true

- insert:
    - id: desktop-directory-picker
      name: '@deepseek-ai/dsh-host-directory-picker-native'

    - id: directory-picker-surface
      name: '@deepseek-ai/dsh-client-ui-directory-picker-native'

    # Desktop-only optional delegation providers. They remain invisible to the
    # model unless the selected Agent Preset grants the matching tool rows.
    - id: subagent-codex
      name: '@deepseek-ai/dsh-subagent-codex'
      config:
        permissionMode: !!js process.env.DSH_CODEX_PERMISSION_MODE ?? 'never'
        # The provider launches the package-local JavaScript wrapper with
        # process.execPath. In Electron that path is the app executable, so
        # opt the child into Electron's supported Node-compatible mode.
        env:
          ELECTRON_RUN_AS_NODE: '1'

    - id: subagent-claude-code
      name: '@deepseek-ai/dsh-subagent-claude-code'
      config:
        permissionMode: !!js process.env.DSH_CLAUDE_PERMISSION_MODE ?? 'plan'

- id: connection
  inject: []
  config:
    trustedHosts: []

- id: modules
  config:
    moduleBaseUrl: !!js process.env.DSH_DESKTOP_MODULE_BASE_URL

# The desktop build is local-model-first. The stock Web composition exposes
# web_search even when its DeepSeek credential is absent, which makes a local
# model repeatedly call a tool that can only fail. Keep the provider settings
# available for a future opt-in, but do not advertise search to the model.
# web_fetch is already disabled by the base composition for SSRF safety.
- id: tool-web
  config:
    search: false
    fetch: false

# Local models sometimes call a desktop tool successfully and then fall back to
# a generic "I cannot access your machine" disclaimer. Ground the next model
# step in the first successful local observation of each user turn. This is an
# advisory, logged context; it grants no permission and changes no tool result.
- id: repeat-tool-reminder
  config:
    thresholds: [3, 5, 8]
    argumentsPreviewChars: 500
    evidenceInclude: [bash, pwsh, read, write, edit, glob, grep, fs_*]
