name: Desktop packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'apps/web/**'
      - 'packages/client/**'
      - 'packages/subagent/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/desktop-build.yml'

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            command: pnpm --dir apps/desktop run dist:mac:arm64
            artifact: apps/desktop/dist/*arm64*
          - name: macOS Intel
            os: macos-15-intel
            command: pnpm --dir apps/desktop run dist:mac:x64
            artifact: apps/desktop/dist/*x64*
          - name: Windows x64
            os: windows-2025
            command: pnpm --dir apps/desktop run dist:win:x64
            artifact: |
              apps/desktop/dist/*.exe
              apps/desktop/dist/*win*.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm --dir apps/desktop run build
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
